name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m unit -q

  replay-e2e-smoke:
    runs-on: ubuntu-latest
    # continue-on-error: this job is known-failing until fixtures/synthetic_v0/
    # llm_cassettes/ contains real recorded Haiku/Sonnet cassettes (requires an
    # Anthropic key never available during M2-M6's build). It's wired now per
    # PLAN.md M6 so the moment cassettes are recorded, this job goes green
    # without further CI changes — until then it reports honestly without
    # blocking merges on a known, tracked gap.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hailmary
          POSTGRES_PASSWORD: hailmary
          POSTGRES_DB: hailmary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hailmary -d hailmary"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Start Elasticsearch
        run: |
          docker run -d --name es -p 9200:9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.14.3
          for i in $(seq 1 30); do curl -sf http://localhost:9200/_cluster/health && break; sleep 2; done

      - name: Start Qdrant
        run: |
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:v1.10.1
          sleep 5

      - name: Cache cross-encoder model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: cross-encoder-ms-marco-MiniLM-L-6-v2

      - name: Migrate database
        run: uv run python scripts/migrate.py

      - name: Run replay E2E smoke test
        env:
          REPLAY_MODE: "true"
          REPLAY_LLM: "true"
        run: uv run python scripts/run_replay_e2e.py
